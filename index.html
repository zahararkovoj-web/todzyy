<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Один заголовок, зато правильный -->
  <title>Цифровой помощник: тест на цифровую нагрузку</title>
  <!-- Описание для ссылок в чатах и соцсетях -->
  <meta name="description" content="Школьный проект по информатике: тест из 10 вопросов, чтобы оценить свою цифровую нагрузку.">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e0f7fa 0%, #c8e6c9 100%);
      --chat-bg: rgba(255, 255, 255, 0.98);
      --primary: #3498db;
      --user-msg: #eaf6ff;
      --bot-msg: #f0f8ff;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg-gradient);
      color: #333;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Фон с птичками */
    .bg-scene {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .check-bird {
      position: absolute;
      width: 36px;
      height: 30px;
      fill: #2c3e50;
      animation: fly infinite ease-in-out;
      opacity: 0.3;
    }
    .check-bird:nth-child(1) { top: 15%; left: 12%; animation-duration: 13s; }
    .check-bird:nth-child(2) { top: 35%; left: 78%; animation-duration: 17s; animation-delay: -5s; }

    @keyframes fly {
      0% { transform: translate(0, 0) rotate(-5deg); }
      50% { transform: translate(50px, -15px) rotate(5deg); }
      100% { transform: translate(100px, 0) rotate(-5deg); }
    }

    /* Окно чата */
    .container {
      max-width: 560px;
      margin: auto;
      background: var(--chat-bg);
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.18);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 80vh;
      position: relative;
      z-index: 10;
    }

    header {
      padding: 16px 20px;
      text-align: center;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #e0e0e0;
    }
    h1 { margin: 0; font-size: 1.3rem; color: #2c3e50; }

    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #fdfdfd;
    }
    .message {
      margin: 12px 0;
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.45;
      position: relative;
      animation: popIn 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-user {
      background: var(--user-msg);
      text-align: right;
      border-bottom-right-radius: 4px;
      align-self: flex-end;
    }
    .msg-bot {
      background: var(--bot-msg);
      text-align: left;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
    }

    .input-area {
      padding: 14px;
      background: rgba(255,255,255,0.7);
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }
    button {
      padding: 12px 22px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.1s, background 0.2s;
    }
    button:hover { background: #2980b9; transform: scale(1.02); }
    button:active { transform: scale(0.98); }

    .disclaimer {
      font-size: 13px;
      color: #555;
      text-align: center;
      margin-top: 20px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

  <!-- Лёгкие птички на фоне -->
  <div class="bg-scene">
    <svg class="check-bird" viewBox="0 0 36 30"><path d="M6 20 L2 24 L12 18 Z M24 6 L28 10 L24 6 Z" fill="#2c3e50"/></svg>
    <svg class="check-bird" viewBox="0 0 36 30"><path d="M6 20 L2 24 L12 18 Z M24 6 L28 10 L24 6 Z" fill="#2c3e50"/></svg>
  </div>

  <!-- Само окно чата -->
  <div class="container">
    <header>
      <h1>🌿 Цифровой помощник</h1>
    </header>

    <div class="chat-box" id="chatBox">
      <div class="message msg-bot">
        Привет! Я помогу оценить твою цифровую нагрузку. Это не диагностика, а самооценка. Хочешь пройти короткий тест из 10 вопросов? Напиши «да» или «нет».
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Напиши что-нибудь..." autocomplete="off">
      <!-- Кнопка с onclick — самый надёжный вариант -->
      <button onclick="sendMessage()">Отправить</button>
    </div>
  </div>

  <p class="disclaimer">
    Важно: это не диагностика и не заменяет консультацию специалиста.
  </p>

<script>
  // Простая и понятная логика
  let state = 'start'; // start, asking, done
  let score = 0;
  let questionIndex = 0;

  const questions = [
    { text: 'Сколько часов в день ты проводишь за экраном (телефон + компьютер) в будни? (1 = меньше 1 часа, 5 = больше 8 часов)', weight: 1 },
    { text: 'Бывает ли, что ты пропускаешь приём пищи из‑за экрана? (1 = никогда, 5 = почти всегда)', weight: 2 },
    { text: 'Насколько трудно тебе оторваться от устройства, когда нужно? (1 = очень легко, 5 = крайне трудно)', weight: 2 },
    { text: 'Влияет ли экранное время на твой сон? (1 = нет, 5 = да, сильно)', weight: 2 },
    { text: 'Часто ли ты проверяешь уведомления сразу, как только они приходят? (1 = почти никогда, 5 = постоянно)', weight: 2 },
    { text: 'Чувствуешь ли ты раздражение, если не можешь пользоваться телефоном какое‑то время? (1 = нет, 5 = часто)', weight: 2 },
    { text: 'Используешь ли ты телефон в первые 15 минут после пробуждения? (1 = нет, 5 = всегда)', weight: 1 },
    { text: 'Бывает ли, что листаешь ленту, чтобы «отдохнуть», но чувствуешь себя уставшим? (1 = редко, 5 = очень часто)', weight: 2 },
    { text: 'Планируешь ли ты время без экрана (прогулки, спорт, чтение)? (1 = регулярно, 5 = никогда)', weight: -1 },
    { text: 'Считаешь ли ты, что экранное время мешает твоим важным делам? (1 = совсем не мешает, 5 = сильно мешает)', weight: 2 }
  ];

  function appendMessage(text, sender) {
    const chatBox = document.getElementById('chatBox');
    const div = document.createElement('div');
    div.className = `message ${sender === 'user' ? 'msg-user' : 'msg-bot'}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    // Добавляем твоё сообщение
    appendMessage(text, 'user');
    input.value = '';

    // Логика бота
    if (state === 'start') {
      const lower = text.toLowerCase();
      if (lower.includes('да') || lower === '1') {
        state = 'asking';
        appendMessage('Отлично. Ответь на 10 вопросов по шкале от 1 до 5 (где 1 — почти никогда, 5 — почти всегда). Начнём:', 'bot');
        askQuestion();
      } else if (lower.includes('нет')) {
        appendMessage('Хорошо. Если позже захочешь пройти тест — просто напиши «да». А если хочешь просто поболтать — я тут.', 'bot');
      } else {
        appendMessage('Хочешь пройти тест? Напиши «да» для начала или «нет», если не хочется. Или можем просто про школу поболтать.', 'bot');
      }
      return;
    }

    if (state === 'asking') {
      const num = parseInt(text);
      if (!isNaN(num) && num >= 1 && num <= 5) {
        score += num * questions[questionIndex].weight;
        questionIndex++;
        if (questionIndex < questions.length) {
          askQuestion();
        } else {
          state = 'done';
          showResult();
        }
      } else {
        appendMessage('Пожалуйста, ответь числом от 1 до 5 на текущий вопрос.', 'bot');
      }
      return;
    }

    if (state === 'done') {
      appendMessage('Спасибо за ответы! Результат уже посчитан. Хочешь узнать итог или просто поболтаем?', 'bot');
    }
  }

  // Отправка по Enter
  const inputField = document.getElementById('userInput');
  inputField.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      sendMessage();
    }
  });

  function askQuestion() {
    appendMessage(questions[questionIndex].text, 'bot');
  }

  function showResult() {
    let level, advice;
    if (score < 20) {
      level = 'Низкий уровень цифровой нагрузки';
      advice = 'Ты хорошо контролируешь экранное время. Продолжай в том же духе!';
    } else if (score < 36) {
      level = 'Средний уровень цифровой нагрузки';
      advice = 'Экран занимает заметную часть дня. Попробуй добавить одно «офлайн-окно» по 20–30 минут в день.';
    } else {
      level = 'Высокий уровень цифровой нагрузки';
      advice = 'Гаджеты сильно влияют на твой день. Попробуй правило: 1 час без экрана перед сном и таймер на 25 минут во время учёбы.';
    }
    appendMessage(`${level}. ${advice}`, 'bot');
  }
</script>
</body>
</html>
